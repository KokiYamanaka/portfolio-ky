<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Koki Yamanaka</title>
<meta name="description" content="Machine learning engineer. I build AI products that actually get used.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="case-study.css?v=5">
</head>
<body class="cs-page">

<header class="cs-header">
  <div class="cs-header-inner cs-container">
    <a class="cs-brand" href="index.html" aria-label="Koki Yamanaka — home">
      <svg class="cs-brand-mark" viewBox="0 0 28 28" aria-hidden="true">
        <path d="M4 24 24 4M4 4h14M4 4v14" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="square"/>
      </svg>
      <span>Koki Yamanaka</span>
    </a>
    <button class="cs-menu-toggle" id="menuToggle" type="button" aria-expanded="false" aria-controls="siteMenu">
      <span class="cs-menu-toggle-label">Menu</span>
    </button>
  </div>
</header>

<nav class="cs-menu" id="siteMenu" hidden>
  <div class="cs-menu-inner cs-container">
    <a href="index.html">Portfolio</a>
    <a href="https://www.linkedin.com/in/koki-yamanaka-48b186243" target="_blank" rel="noopener">LinkedIn</a>
  </div>
</nav>

<main>

  <!-- ========== HERO ========== -->
  <section class="cs-container cs-hero">
    <h1 class="cs-title">Koki Yamanaka</h1>
    <h4 class="cs-role">Client Project Manager + Software Engineer</h4>
    <p class="cs-tagline">I manage and build digital marketing products for enterprises.</p>
  </section>

  <!-- ========== WORK LIST ========== -->
  <section class="cs-section cs-container" id="work">
    <h2 class="cs-section-title">Work</h2>
    <div class="cs-section-body">
      <p>Project Management</p>
    </div>

    <div class="work-list">

      <a class="work-item" href="dior.html">
        <figure class="media-slot" style="--ar: 16/10;">
          <img src="images/dior/hero.avif" alt="Dior boutique storefront">
          <figcaption>Dior</figcaption>
        </figure>
        <div class="work-item-text">
          <h3>Dior</h3>
          <p>Boutique Booking Platform</p>
        </div>
      </a>

      <a class="work-item" href="tumi.html">
        <figure class="media-slot" style="--ar: 16/10;">
          <img src="images/tumi/hero.webp" alt="Tumi flagship storefront in Omotesando at night">
          <figcaption>Tumi</figcaption>
        </figure>
        <div class="work-item-text">
          <h3>Tumi</h3>
          <p>In-Store CRM Platform</p>
        </div>
      </a>

      <!-- TODO: add more case studies here as they're built -->

    </div>
  </section>

  <footer class="cs-footer cs-container">
    <a href="https://www.linkedin.com/in/koki-yamanaka-48b186243" target="_blank" rel="noopener">LinkedIn</a>
  </footer>

</main>

<script>
  document.querySelectorAll('.media-slot > img').forEach(function (img) {
    var markEmpty = function () { img.closest('.media-slot').classList.add('is-empty'); };
    if (img.complete && img.naturalWidth === 0) {
      markEmpty();
    } else {
      img.addEventListener('error', markEmpty);
    }
  });

  (function () {
    var toggle = document.getElementById('menuToggle');
    var menu = document.getElementById('siteMenu');
    var label = toggle.querySelector('.cs-menu-toggle-label');

    toggle.addEventListener('click', function () {
      var willOpen = menu.hidden;
      menu.hidden = !willOpen;
      toggle.setAttribute('aria-expanded', String(willOpen));
      label.textContent = willOpen ? 'Close' : 'Menu';
    });
  })();
</script>

</body>
</html>
